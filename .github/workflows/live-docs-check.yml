name: Documentação viva

on:
  pull_request:
    paths: ['src/**', 'supabase/**', 'docs/**', 'scripts/check-live-docs.mjs']
  push:
    branches: [main]
    paths: ['src/**', 'supabase/**', 'docs/**', 'scripts/check-live-docs.mjs']

jobs:
  check-live-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar documentação viva
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run check:live-docs -- "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            npm run check:live-docs -- "${{ github.event.before }}" "${{ github.sha }}"
          fi
