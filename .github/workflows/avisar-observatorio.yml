name: Avisar Observatório

# Ao entrar código na main, avisa o Observatório para atualizar o painel.
# Não bloqueia nada: se falhar, o push já aconteceu (PRINCIPIOS.md, 1 e 5).
on:
  push:
    branches: [main]

jobs:
  avisar:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Disparar evento no Observatório
        env:
          TOKEN: ${{ secrets.OBSERVATORIO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "OBSERVATORIO_TOKEN ausente — nada a fazer."
            exit 0
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/GabeBrain/observatorio/dispatches \
            -d @- <<JSON
          {
            "event_type": "sistema-atualizado",
            "client_payload": {
              "sistema": "Relatorios API",
              "repo": "${{ github.repository }}",
              "sha": "${{ github.sha }}",
              "autor": "${{ github.event.head_commit.author.name }}"
            }
          }
          JSON
