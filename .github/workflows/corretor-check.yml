name: Corretor contratos e regras
on:
  push:
    branches: [main]
    paths: ['src/features/corretor/**', 'supabase/functions/**', 'supabase/migrations/**', '.github/workflows/corretor-check.yml']
  pull_request:
    paths: ['src/features/corretor/**', 'supabase/functions/**', 'supabase/migrations/**', '.github/workflows/corretor-check.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: >-
          npx vitest run
          src/features/corretor/lib/v3/__tests__/review-guajajaras.test.ts
          src/features/corretor/lib/v3/__tests__/review-recovery.test.ts
          src/features/corretor/lib/v3/__tests__/review-controller-resume.test.ts
          src/features/corretor/lib/v3/__tests__/unread-coverage-resume.test.ts
          src/features/corretor/components/StudyRecoveryPanel.test.tsx
      - run: npm run build
      # O replay de dez passes usa materiais locais grandes e não roda IA em CI.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --no-config supabase/functions/analyze-text-batch/index.ts supabase/functions/analyze-table-image/index.ts supabase/functions/analyze-ata-image/index.ts supabase/functions/corretor-execution/index.ts
